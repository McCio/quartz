name: Sync Plugin (reusable)

on:
  workflow_call:
    inputs:
      repo:
        description: "GitHub repo to sync (e.g. McCio/quartz-plugin-folder-page)"
        required: true
        type: string
    secrets:
      SYNC_GH_TOKEN:
        required: true
    outputs:
      changed:
        description: "Whether the plugin upstream sync pushed new commits"
        value: ${{ jobs.sync.outputs.changed }}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
    env:
      GH_TOKEN: ${{ secrets.SYNC_GH_TOKEN }}
    steps:
      - name: Trigger plugin sync
        id: trigger
        run: |
          TRIGGER_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DEFAULT_BRANCH=$(gh api repos/${{ inputs.repo }} --jq '.default_branch')
          BEFORE_SHA=$(gh api repos/${{ inputs.repo }}/git/refs/heads/$DEFAULT_BRANCH --jq '.object.sha')
          gh workflow run sync.yml --repo ${{ inputs.repo }}
          echo "trigger_time=$TRIGGER_TIME" >> "$GITHUB_OUTPUT"
          echo "before_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Wait for plugin sync to complete
        id: poll
        run: |
          TRIGGER_TIME="${{ steps.trigger.outputs.trigger_time }}"
          BEFORE_SHA="${{ steps.trigger.outputs.before_sha }}"
          TIMEOUT=900
          INTERVAL=30
          ELAPSED=0
          sleep 15
          while [ $ELAPSED -lt $TIMEOUT ]; do
            RESULT=$(gh run list --repo ${{ inputs.repo }} --workflow=sync.yml --limit=5 \
              --json databaseId,status,conclusion,createdAt \
              --jq "[.[] | select(.createdAt >= \"$TRIGGER_TIME\")] | .[0]")
            STATUS=$(echo "$RESULT" | jq -r '.status // empty')
            CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion // empty')
            if [ "$STATUS" = "completed" ]; then
              AFTER_SHA=$(gh api repos/${{ inputs.repo }}/git/refs/heads/${{ steps.trigger.outputs.default_branch }} --jq '.object.sha')
              if [ "$CONCLUSION" = "success" ] && [ "$AFTER_SHA" != "$BEFORE_SHA" ]; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
              else
                echo "changed=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Timed out waiting for plugin sync (${{ inputs.repo }})" >&2
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 1
